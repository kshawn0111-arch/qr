<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#eaf5ef">
<title>QR Code 產生器</title>
<style>
:root{--canvas:#edf6f0;--paper:#fff;--powder:#dcefe5;--sky:#dcecff;--blue:#2650c8;--green:#22a06b;--ink:#172b4d;--muted:#64748b;--line:#dce7e1;--shadow:0 16px 40px rgba(35,72,91,.10)}
*{box-sizing:border-box}
input,select,textarea{max-width:100%;font:inherit}
body{margin:0;background:linear-gradient(135deg,#edf6f0 0%,#eef4ff 100%);font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;color:var(--ink);min-height:100vh}
.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,72px);background:rgba(255,255,255,.72);border-bottom:1px solid rgba(220,231,225,.8);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.3px}.brand-mark{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--blue),#4f8be8);display:grid;place-items:center;color:#fff;font-size:21px;box-shadow:0 7px 15px #2650c833}
.top-note{font-size:13px;color:var(--muted)}
main{max-width:1100px;margin:0 auto;padding:44px 22px 60px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px}
.eyebrow{color:var(--green);font-weight:800;font-size:12px;letter-spacing:1.7px;text-transform:uppercase}
h1{font-size:clamp(30px,4vw,42px);line-height:1.15;margin:9px 0 10px;letter-spacing:-1px}
.subtitle{color:var(--muted);margin:0;line-height:1.7}
.hero-chip{background:#e1f3e9;color:#18794e;border:1px solid #c9e8d6;border-radius:99px;padding:9px 14px;font-size:13px;font-weight:700;white-space:nowrap}
.layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:22px;align-items:start}
.panel{background:rgba(255,255,255,.92);border:1px solid rgba(220,231,225,.9);border-radius:24px;padding:26px;box-shadow:var(--shadow)}
.panel h2{font-size:18px;margin:0 0 20px;display:flex;align-items:center;gap:10px}
.step{width:28px;height:28px;border-radius:9px;background:var(--sky);color:var(--blue);display:grid;place-items:center;font-size:13px;font-weight:800}
.field{margin-bottom:19px}.field label{display:block;font-weight:700;font-size:14px;margin-bottom:9px}
textarea{width:100%;min-height:142px;resize:vertical;border:1px solid #d6e2df;border-radius:14px;padding:14px 15px;outline:none;color:var(--ink);background:#fbfdfc;line-height:1.6;transition:.2s}
textarea:focus,input:focus,select:focus{border-color:#7da0ed;box-shadow:0 0 0 3px #2650c817}
.hint{font-size:12px;color:var(--muted);margin-top:7px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
select,input[type="number"]{width:100%;height:44px;border:1px solid #d6e2df;border-radius:12px;padding:0 12px;background:#fbfdfc;color:var(--ink);outline:none}
.color-row{display:flex;align-items:center;gap:10px;height:44px;border:1px solid #d6e2df;border-radius:12px;padding:5px 10px;background:#fbfdfc}
input[type="color"]{width:34px;height:30px;border:0;background:transparent;padding:0;cursor:pointer}
.color-code{font-size:13px;color:var(--muted);font-family:ui-monospace,monospace}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:23px}
button{border:0;border-radius:13px;padding:13px 19px;font-weight:800;cursor:pointer;transition:transform .15s,box-shadow .15s;font-size:14px}
button:hover{transform:translateY(-1px)}
.primary{background:var(--blue);color:white;box-shadow:0 8px 18px #2650c833;flex:1}
.secondary{background:#e8f2ec;color:#206b4b}
.preview-panel{position:sticky;top:22px;text-align:center;background:linear-gradient(160deg,#fff 0%,#f6fbf8 100%)}
.preview-panel h2{text-align:left}
.qr-stage{min-height:310px;border:1px dashed #cbded3;border-radius:20px;background:linear-gradient(145deg,#f5faf7,#f1f6ff);display:grid;place-items:center;padding:22px;margin-bottom:18px}
#qrcode{background:#fff;border-radius:14px;padding:14px;min-width:180px;min-height:180px;display:grid;place-items:center;box-shadow:0 10px 28px rgba(32,65,83,.10)}
#qrcode img,#qrcode canvas{display:block;max-width:100%;height:auto!important}
.placeholder{color:#8a9b95;font-size:13px;line-height:1.8}.placeholder .big{font-size:42px;display:block;margin-bottom:8px}
.preview-caption{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 18px;overflow-wrap:anywhere}
.download{width:100%;background:var(--green);color:#fff;box-shadow:0 8px 18px #22a06b30}
.download:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.status{font-size:12px;color:var(--muted);margin-top:12px;min-height:18px}
.footer{text-align:center;color:#82918c;font-size:12px;margin-top:28px}
@media(max-width:760px){main{padding:30px 16px 42px}.layout{grid-template-columns:1fr}.preview-panel{position:static}.hero{align-items:flex-start;flex-direction:column;gap:12px}.panel{padding:21px}}
@media(max-width:420px){.grid2{grid-template-columns:1fr}.top-note{display:none}.panel{border-radius:19px}.qr-stage{min-height:260px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark">▦</span><span>QR Studio</span></div>
  <div class="top-note">簡單・快速・本機產生</div>
</header>
<main>
  <section class="hero">
    <div><div class="eyebrow">SMART QR TOOL</div><h1>QR Code 產生器</h1><p class="subtitle">把網址、文字或聯絡資訊，快速轉換成可掃描的 QR Code。</p></div>
    <div class="hero-chip">✦ 免費使用</div>
  </section>
  <section class="layout">
    <div class="panel">
      <h2><span class="step">01</span>輸入內容與設定</h2>
      <div class="field">
        <label for="content">要製作成 QR Code 的內容</label>
        <textarea id="content" placeholder="請輸入網址、文字、電話或其他資訊…">https://www.google.com</textarea>
        <div class="hint">可輸入網址、純文字、電子郵件、電話等內容。</div>
      </div>
      <div class="grid2">
        <div class="field"><label for="size">圖片尺寸</label><select id="size"><option value="180">小型（180 px）</option><option value="256" selected>標準（256 px）</option><option value="360">大型（360 px）</option><option value="512">高解析（512 px）</option></select></div>
        <div class="field"><label for="level">容錯等級</label><select id="level"><option value="L">L－低（約 7%）</option><option value="M" selected>M－中（約 15%）</option><option value="Q">Q－高（約 25%）</option><option value="H">H－最高（約 30%）</option></select></div>
        <div class="field"><label>QR Code 顏色</label><div class="color-row"><input id="dark" type="color" value="#172b4d"><span class="color-code" id="darkCode">#172B4D</span></div></div>
        <div class="field"><label>背景顏色</label><div class="color-row"><input id="light" type="color" value="#ffffff"><span class="color-code" id="lightCode">#FFFFFF</span></div></div>
      </div>
      <div class="actions"><button class="primary" id="generate">✦ 產生 QR Code</button><button class="secondary" id="clear">清除內容</button></div>
    </div>
    <aside class="panel preview-panel">
      <h2><span class="step">02</span>QR Code 預覽</h2>
      <div class="qr-stage"><div id="qrcode"><div class="placeholder"><span class="big">▦</span>輸入內容後，按下「產生 QR Code」</div></div></div>
      <p class="preview-caption" id="caption">尚未產生 QR Code</p>
      <button class="download" id="download" disabled>↓ 下載 PNG 圖片</button>
      <div class="status" id="status" aria-live="polite"></div>
    </aside>
  </section>
  <div class="footer">內容在瀏覽器本機處理，不會上傳至本工具的伺服器。</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(() => {
 const $ = id => document.getElementById(id);
 let currentDataUrl = '';
 const qrBox = $('qrcode');
 function setStatus(message){ $('status').textContent = message; }
 function generate(){
   const value = $('content').value.trim();
   if(!value){setStatus('請先輸入要轉換的內容。');$('content').focus();return;}
   if(typeof QRCode === 'undefined'){setStatus('QR Code 引擎載入失敗，請確認網路連線後重新整理頁面。');return;}
   const size = Number($('size').value);
   qrBox.innerHTML = '';
   try{
     new QRCode(qrBox,{text:value,width:size,height:size,colorDark:$('dark').value,colorLight:$('light').value,correctLevel:QRCode.CorrectLevel[$('level').value]});
     const canvas = qrBox.querySelector('canvas');
     const img = qrBox.querySelector('img');
     if(canvas){currentDataUrl=canvas.toDataURL('image/png');}
     else if(img){currentDataUrl=img.src;}
     $('download').disabled = !currentDataUrl;
     $('caption').textContent = value.length > 72 ? value.slice(0,69)+'…' : value;
     setStatus('已成功產生！可下載 PNG 圖片。');
   }catch(e){currentDataUrl='';$('download').disabled=true;setStatus('內容太長或格式不支援，請縮短內容後再試一次。');}
 }
 $('generate').addEventListener('click',generate);
 $('content').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')generate();});
 $('clear').addEventListener('click',()=>{$('content').value='';qrBox.innerHTML='<div class="placeholder"><span class="big">▦</span>輸入內容後，按下「產生 QR Code」</div>';currentDataUrl='';$('download').disabled=true;$('caption').textContent='尚未產生 QR Code';setStatus('內容已清除。');$('content').focus();});
 $('download').addEventListener('click',()=>{if(!currentDataUrl)return;const a=document.createElement('a');a.href=currentDataUrl;a.download='my-qrcode.png';document.body.appendChild(a);a.click();a.remove();});
 [['dark','darkCode'],['light','lightCode']].forEach(([input,label])=>$(input).addEventListener('input',()=>{$(label).textContent=$(input).value.toUpperCase();}));
 // The QR library is loaded from CDN; the QR content itself is encoded locally in the browser.
 if(typeof QRCode==='undefined'){setStatus('正在載入 QR Code 引擎…若無法產生，請檢查網路連線。');}
})();
</script>
</body>
</html>
